# Render the book (HTML + PDF) and publish it to GitHub Pages.
#   - every push to main: render and publish
#   - every pull request: render only, so problems show up before merging
#   - "Run workflow" button on the Actions tab: render and publish on demand
# Setup steps: see GITHUB_SETUP.md

name: Render and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto (with TinyTeX for the PDF)
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: true

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Keep this list in step with the packages used in R/ and scripts/
          packages: |
            any::here
            any::dplyr
            any::readr
            any::ggplot2
            any::knitr
            any::rmarkdown
            any::DT
            any::maps

      - name: Render only (pull requests)
        if: github.event_name == 'pull_request'
        uses: quarto-dev/quarto-actions/render@v2

      - name: Render and publish to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
